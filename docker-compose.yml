# Full local stack: PostgreSQL + FastAPI backend + Streamlit dashboard.
#
# Quick start (no credentials needed - runs in demo mode):
#   docker compose up --build
#
# Then open:
#   Dashboard: http://localhost:8501
#   API docs:  http://localhost:8000/docs
#
# To run against real Gmail/Calendar/Anthropic, set DEMO_MODE=false and
# provide GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and ANTHROPIC_API_KEY
# below (or via a .env file - docker compose loads .env automatically).
# NOTE: Gmail OAuth requires an interactive browser flow, so DEMO_MODE=false
# is intended for local runs only, not the hosted/cloud demo.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: email_automation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "AI Email-to-Action Automation System"
      ENV: production
      DEMO_MODE: ${DEMO_MODE:-true}
      DATABASE_URL: postgresql://app:app@db:5432/email_automation
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/callback}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  pgdata:
